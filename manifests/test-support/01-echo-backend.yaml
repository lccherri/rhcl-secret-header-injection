apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: minha-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
      - name: echo
        image: quay.io/kuadrant/authorino-examples:talker-api
        env:
        - name: PORT
          value: "3000"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: minha-app
spec:
  selector: {app: echo}
  ports:
  - port: 80
    targetPort: 3000
