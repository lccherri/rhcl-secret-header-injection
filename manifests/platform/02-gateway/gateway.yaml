apiVersion: v1
kind: Namespace
metadata:
  name: api-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: external
  namespace: api-gateway
  annotations:
    # ClusterIP service exposed through an OpenShift Route, for clusters without a LoadBalancer provider
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.apps.cluster-cddgq.dyn.redhatworkshops.io"
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: external-gateway
  namespace: api-gateway
spec:
  host: api-minha-app.apps.cluster-cddgq.dyn.redhatworkshops.io
  to:
    kind: Service
    name: external-istio
  port:
    targetPort: 80
